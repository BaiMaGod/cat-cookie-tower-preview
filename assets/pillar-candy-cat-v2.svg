<svg xmlns="http://www.w3.org/2000/svg" width="220" height="760" viewBox="0 0 220 760">
<defs>
  <linearGradient id="cream" x1="0" x2="1">
    <stop offset="0" stop-color="#f7c982"/><stop offset=".16" stop-color="#ffe8b7"/>
    <stop offset=".50" stop-color="#fff4d2"/><stop offset=".80" stop-color="#ffe2a7"/><stop offset="1" stop-color="#eebc72"/>
  </linearGradient>
  <linearGradient id="creamSoft" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#fff7da"/><stop offset=".6" stop-color="#ffe5ad"/><stop offset="1" stop-color="#edbd79"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2=".8" y2="1">
    <stop offset="0" stop-color="#ffb0c7"/><stop offset=".48" stop-color="#ff7ea8"/><stop offset="1" stop-color="#ed5e8c"/>
  </linearGradient>
  <pattern id="candy" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)">
    <rect width="52" height="52" fill="#ffe8df"/><rect width="23" height="52" fill="#ff7ea9"/>
  </pattern>
  <radialGradient id="shine" cx=".25" cy=".08" r=".9">
    <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".32" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-35%" y="-20%" width="170%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#9d5f61" flood-opacity=".22"/>
  </filter>
  <filter id="emboss" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#b78050" flood-opacity=".22"/>
    <feDropShadow dx="0" dy="-1" stdDeviation="1.1" flood-color="#ffffff" flood-opacity=".9"/>
  </filter>

  <g id="face" filter="url(#emboss)">
    <path d="M-46 -18 L-39 -48 Q-37 -57 -29 -50 L-16 -40 Q0 -47 16 -40 L29 -50 Q37 -57 39 -48 L46 -18 Q50 5 36 20 Q20 36 0 38 Q-20 36 -36 20 Q-50 5 -46 -18Z"
          fill="url(#creamSoft)" stroke="#f0c78d" stroke-width="1.6"/>
    <path d="M-25 0 q7 -8 14 0 M11 0 q7 -8 14 0" fill="none" stroke="#cf7446" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M-3 8 q3 -4 6 0 q-3 5 -6 0Z" fill="#cf7446"/>
    <path d="M0 12 q-2 9 -10 6 M0 12 q2 9 10 6" fill="none" stroke="#cf7446" stroke-width="2.6" stroke-linecap="round"/>
    <g stroke="#cf7446" stroke-width="2.5" stroke-linecap="round">
      <path d="M-33 8 l-12 -2"/><path d="M-33 15 l-12 1"/><path d="M33 8 l12 -2"/><path d="M33 15 l12 1"/>
    </g>
    <ellipse cx="-17" cy="14" rx="8" ry="4.5" fill="#ffb9bb" opacity=".45"/><ellipse cx="17" cy="14" rx="8" ry="4.5" fill="#ffb9bb" opacity=".45"/>
    <ellipse cx="-14" cy="-28" rx="16" ry="8" fill="url(#shine)" opacity=".35"/>
  </g>

  <g id="paw" filter="url(#emboss)" fill="url(#pink)">
    <circle cx="-22" cy="-8" r="8.5"/><circle cx="-7" cy="-15" r="8.5"/><circle cx="8" cy="-15" r="8.5"/><circle cx="23" cy="-8" r="8.5"/>
    <path d="M-23 12 Q-20 -3 -7 0 Q0 -9 8 0 Q22 0 24 13 Q22 28 0 28 Q-22 28 -23 12Z"/>
    <g fill="#fff" opacity=".35"><ellipse cx="-9" cy="5" rx="9" ry="4" transform="rotate(-18)"/></g>
  </g>

  <g id="flower" filter="url(#emboss)" fill="url(#pink)">
    <circle r="7"/><circle cy="-8" r="6"/><circle cx="8" r="6"/><circle cx="-8" r="6"/><circle cy="8" r="6"/><circle r="3.5" fill="#ffcad7"/>
  </g>
  <g id="star" filter="url(#emboss)" fill="url(#pink)"><path d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3Z"/></g>

  <g id="module">
    <rect x="29" y="0" width="162" height="178" rx="28" fill="url(#cream)" stroke="#efc17b" stroke-width="1.4"/>
    <path d="M43 11 Q62 1 98 3" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".38"/>
    <path d="M178 16 Q184 47 179 85" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".22"/>
    <use href="#face" transform="translate(110 72) scale(.88)"/>
    <use href="#paw" transform="translate(110 140) scale(.72)"/>
    <use href="#flower" transform="translate(26 72) scale(.70)"/><use href="#flower" transform="translate(194 72) scale(.70)"/>
    <use href="#star" transform="translate(35 128) scale(.72)"/><use href="#star" transform="translate(185 128) scale(.72)"/>
  </g>
</defs>

<g filter="url(#shadow)">
  <rect x="35" y="3" width="150" height="42" rx="22" fill="url(#creamSoft)" stroke="#e9b96d" stroke-width="1.3"/>
  <ellipse cx="110" cy="13" rx="58" ry="11" fill="#d8a459" opacity=".48"/><ellipse cx="110" cy="10" rx="55" ry="8.5" fill="#a86f32" opacity=".24"/>
  <path d="M58 8 Q110 -1 162 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <rect x="21" y="38" width="178" height="48" rx="24" fill="url(#candy)" stroke="#ec7f9d" stroke-width="1.2"/>
  <path d="M36 48 Q78 36 119 40" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <use href="#module" y="78"/>

  <rect x="21" y="244" width="178" height="48" rx="24" fill="url(#candy)" stroke="#ec7f9d" stroke-width="1.2"/>
  <path d="M38 254 Q81 243 120 247" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".50"/>
  <use href="#module" y="284"/>

  <rect x="21" y="450" width="178" height="48" rx="24" fill="url(#candy)" stroke="#ec7f9d" stroke-width="1.2"/>
  <path d="M38 460 Q81 449 120 453" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".50"/>
  <use href="#module" y="490"/>

  <rect x="21" y="656" width="178" height="48" rx="24" fill="url(#candy)" stroke="#ec7f9d" stroke-width="1.2"/>
  <path d="M38 666 Q81 655 120 659" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".50"/>
  <rect x="34" y="699" width="152" height="33" rx="17" fill="url(#creamSoft)" opacity=".98"/>
  <path d="M49 705 Q91 695 138 701" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".45"/>
</g>
</svg>