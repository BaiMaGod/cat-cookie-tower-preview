<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8ddcff" />
  <title>猫猫果冻塔</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./app.css?v=1951392e8c61" />
</head>
<body>
  <main id="phoneFrame" class="phone-frame at-home">
    <div class="world-backdrop" aria-hidden="true"></div>
    <div id="game" aria-label="左右拖动旋转果冻塔"></div>

    <div id="hud" class="hud">
      <div class="hud-card stat">
        <img class="hud-icon" src="./assets/ui-depth-game.png" alt="" />
        <span class="stat-copy"><span class="label">层数</span><strong id="depth">0</strong></span>
      </div>
      <div id="jumpBox" class="hud-card jump-box">
        <img class="hud-icon bounce" src="./assets/ui-bounce-game.png" alt="" />
        <span class="stat-copy"><span class="label">弹跳</span><strong id="jumps">× 5</strong></span>
      </div>
      <div class="hud-card stat right">
        <img class="hud-icon" src="./assets/star-game.png" alt="" />
        <span class="stat-copy"><span class="label">分数</span><strong id="score">0</strong></span>
      </div>
    </div>

    <div id="combo" class="combo">连吃 ×2</div>
    <div class="world-label" aria-hidden="true">✦ 果冻乐园 ✦</div>
    <div id="toast" class="toast">
      <div class="gesture-badge" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path class="gesture-arrows" d="M8 21h13m-8-5-5 5 5 5m43-5H43m8-5 5 5-5 5" />
          <g class="gesture-hand"><path d="M25 38V21c0-6 8-6 8 0v12-5c0-5 7-5 7 0v5-2c0-4 7-4 7 0v10c0 10-6 16-14 16-5 0-8-3-11-7l-7-10c-3-5 2-9 6-5l4 3Z" /></g>
        </svg>
      </div>
      <div class="gesture-copy"><span class="guide-kicker">小爪爪，准备好了吗？</span><strong>左右滑动，转动果冻塔</strong><small>找准缺口，让猫猫一路往下跳</small></div>
      <div class="guide-reward"><span>✦</span> 连吃果冻，补充弹跳 <b>＋1</b></div>
    </div>

    <div id="gameOver" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="deathTitle">
      <div class="card result-card">
        <div class="result-content">
        <img class="result-cat" src="./assets/cat-fail-game.png" alt="" />
        <div id="deathEmoji" class="death-emoji" hidden>😿</div>
        <span class="result-kicker">本 次 冒 险 结 束</span>
        <h1 id="deathTitle">没力气啦！</h1>
        <p id="deathText">多吃几层果冻，补充弹跳次数。</p>
        <div class="results">
          <div><span>下降层数</span><strong id="finalDepth">0 层</strong></div>
          <div><span>最高连吃</span><strong id="finalCombo">×0</strong></div>
          <div><span>得分</span><strong id="finalScore">0</strong></div>
        </div>
        <button id="restartBtn"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 7a8 8 0 1 0 1 9M19 3v5h-5" /></svg><span>再来一次</span></button>
        <button id="homeBtn" class="result-home-btn">返回首页</button>
        </div>
      </div>
    </div>

    <section id="homeScreen" class="home-screen" aria-label="猫猫果冻塔首页">
      <div class="home-scenery" aria-hidden="true">
        <div class="home-pillar"></div>
        <img class="home-jelly jelly-1" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-jelly jelly-2" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-jelly jelly-3" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-jelly jelly-4" src="./assets/home-jelly-danger.png" alt="" />
        <img class="home-jelly jelly-5" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-jelly jelly-6" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-jelly jelly-7" src="./assets/home-jelly-danger.png" alt="" />
        <img class="home-jelly jelly-8" src="./assets/home-jelly-safe.png" alt="" />
        <img class="home-cat" src="./assets/cat-fall-game.png" alt="" />
      </div>
      <h1 class="home-title"><img src="./assets/home-title.png" alt="猫猫果冻塔，越掉越甜，越深越惊喜" /></h1>
      <button id="settingsBtn" class="home-settings-btn" type="button" aria-label="打开设置">
        <img src="./assets/home-settings.png" alt="" />
      </button>
      <button id="startBtn" class="home-start-btn" type="button" aria-label="开始游戏">
        <img src="./assets/home-start.png" alt="" />
      </button>
    </section>

    <div id="settingsPanel" class="overlay home-settings-panel hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="home-settings-card">
        <button id="closeSettingsBtn" class="home-settings-close" type="button" aria-label="关闭设置">×</button>
        <h2 id="settingsTitle">游戏设置</h2>
        <p>左右滑动旋转果冻塔，让胖猫从缺口落下。穿过果冻可以补充弹跳次数，避开粉红色危险果冻。</p>
        <label class="home-motion-setting"><span>首页动画</span><input id="homeMotionToggle" type="checkbox" checked /><span class="home-motion-switch" aria-hidden="true"></span></label>
        <label class="home-motion-setting"><span>游戏音效</span><input id="soundToggle" type="checkbox" checked /><span class="home-motion-switch" aria-hidden="true"></span></label>
        <button id="settingsDoneBtn" class="home-settings-done" type="button">完成</button>
      </div>
    </div>

    <div id="loading" class="overlay loading">
      <div class="loader-card">
        <img class="loader-cat" src="./assets/cat-idle-game.png" alt="" />
        <h1>猫猫果冻塔</h1>
        <p>正在进入果冻乐园……</p>
      </div>
    </div>
  </main>

  <script type="module" src="./boot.bundle.js?v=1951392e8c61"></script>
</body>
</html>
